<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Mercedes-Benz Clean Vector Symbol -->
  <defs>
    <linearGradient id="mb-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8a9ba8"/>
      <stop offset="100%" stop-color="#3d4952"/>
    </linearGradient>
    <linearGradient id="mb-star-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c5d0d8"/>
    </linearGradient>
    <linearGradient id="mb-star-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6872"/>
      <stop offset="100%" stop-color="#2a333a"/>
    </linearGradient>
    <linearGradient id="mb-star-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aaab6"/>
      <stop offset="100%" stop-color="#60717d"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#mb-ring)" stroke-width="26"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#162032" stroke-width="3" opacity="0.3"/>

  <!-- Three-Pointed Star -->
  <!-- Top Point (Center: 256, 256 -> Tip: 256, 34) -->
  <polygon points="256,256 256,34 238,242" fill="url(#mb-star-light)"/>
  <polygon points="256,256 256,34 274,242" fill="url(#mb-star-dark)"/>

  <!-- Bottom Right Point (Center: 256, 256 -> Tip: 448, 367) -->
  <polygon points="256,256 448,367 274,242" fill="url(#mb-star-light)"/>
  <polygon points="256,256 448,367 245,268" fill="url(#mb-star-mid)"/>

  <!-- Bottom Left Point (Center: 256, 256 -> Tip: 64, 367) -->
  <polygon points="256,256 64,367 245,268" fill="url(#mb-star-dark)"/>
  <polygon points="256,256 64,367 238,242" fill="url(#mb-star-mid)"/>

  <!-- Central Hub -->
  <circle cx="256" cy="256" r="10" fill="#c5d0d8"/>
</svg>